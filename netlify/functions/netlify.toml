[build]
  publish = "public"
  functions = "netlify/functions"

# ── Security headers on every page ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://pbs.twimg.com https://tr.rbxcdn.com https://api.web3forms.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https://pbs.twimg.com https://tr.rbxcdn.com; frame-src https://www.youtube.com; connect-src 'self' https://api.web3forms.com;"

# ── Cache static assets for 1 year ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Short cache for serverless function ──
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "public, max-age=25"

# ── SPA fallback ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
